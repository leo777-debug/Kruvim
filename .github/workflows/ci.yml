name: CI

on:
  push:
    branches: [main, kruvim, 'release/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check app tests scripts migrations tools
      - run: pytest -n 4 --dist loadfile -q

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kruvim
          POSTGRES_PASSWORD: kruvim
          POSTGRES_DB: kruvim
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kruvim" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      KRUVIM_DATABASE_URL: postgresql+asyncpg://kruvim:kruvim@localhost:5432/kruvim
      KRUVIM_REDIS_URL: redis://localhost:6379/0
      KRUVIM_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Upgrade, downgrade and upgrade again on PostgreSQL
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - run: alembic check
      - run: python -m tools.verify_production
      - name: Upgrade a disposable previous-head database and verify memory and source tables
        env:
          KRUVIM_MEMORY_TEST_PG_URL: postgresql://kruvim:kruvim@localhost:5432/kruvim
        run: python -m tools.verify_memory_postgres

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm run lint
      - run: npm run test:navigation
      - run: node tools/test-agent-selection.mjs
      - run: node tools/test-retest.mjs
      - run: npx vite build
      - run: node tools/check-page-bundles.mjs
      - run: npm audit --audit-level=high

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg RELEASE_SHA=${{ github.sha }} -t kruvim-api ./backend
      - run: docker build -t kruvim-web ./frontend

  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: git worktree add --detach "$RUNNER_TEMP/kruvim-baseline" 8e9aab50557ee114447c2c5240bb7fded43a7205
      - run: python -m tools.verify_release_rollback --baseline-backend "$RUNNER_TEMP/kruvim-baseline/backend"
        working-directory: backend

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak
      - run: python frontend/tools/create-local-processing-fixtures.py
      - run: npm run test:e2e
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright test --config playwright.loading.config.ts
        working-directory: frontend
      - run: npx playwright test --config playwright.conservative.config.ts
        working-directory: frontend
      - run: npx playwright test --config playwright.local.config.ts
        working-directory: frontend
      - run: npx playwright test --config playwright.local-production.config.ts
        working-directory: frontend

  landing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing-page/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm audit --audit-level=high
