name: CI

on:
  push:
    branches: [main, kruvim]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check app tests scripts migrations tools
      - run: pytest -q
      - name: Ten consecutive complete suites with shuffled orders
        run: python -m tools.repeat_suite --runs 10 --workers 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-repeat-suite
          path: backend/data/repeat-suite

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kruvim
          POSTGRES_PASSWORD: kruvim
          POSTGRES_DB: kruvim
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kruvim" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      KRUVIM_DATABASE_URL: postgresql+asyncpg://kruvim:kruvim@localhost:5432/kruvim
      KRUVIM_REDIS_URL: redis://localhost:6379/0
      KRUVIM_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Upgrade, downgrade and upgrade again on PostgreSQL
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - run: alembic check
      - run: python -m tools.verify_production
      - name: Upgrade a disposable previous-head database and verify memory and source tables
        env:
          KRUVIM_MEMORY_TEST_PG_URL: postgresql://kruvim:kruvim@localhost:5432/kruvim
        run: python -m tools.verify_memory_postgres

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm run test:navigation
      - run: node tools/test-retest.mjs
      - run: npx vite build
      - run: npm audit --audit-level=high

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t kruvim-api ./backend
      - run: docker build -t kruvim-web ./frontend

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e -- --repeat-each=3
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-traces
          path: frontend/test-results

  fresh-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: One-command local setup, migrations, seed and build
        env:
          KRUVIM_ENV: development
          KRUVIM_DATABASE_URL: sqlite+aiosqlite:////tmp/kruvim-fresh.db
          KRUVIM_DATA_DIR: /tmp/kruvim-fresh-data
        run: python tools/dev.py --check
      - name: Start actual Compose stack
        env:
          KRUVIM_SECRET_KEY: ci-only-compose-secret-with-more-than-32-characters
          KRUVIM_POPULATION_SIZE: "40000"
        run: |
          docker compose up --build --wait --wait-timeout 240
          curl --fail --retry 15 --retry-delay 2 http://localhost:8080/api/v1/readyz
          docker compose exec -T -e KRUVIM_ENV=test api python -m tools.verify_production
          docker compose exec -T worker python -c "import asyncio; from app.core.redis import get_redis; print(asyncio.run(get_redis().ping()))"
          .venv/bin/python -m tools.compose_smoke --url http://localhost:8080
        working-directory: backend
      - name: Compose logs
        if: failure()
        run: docker compose logs --tail 150
      - name: Stop disposable stack
        if: always()
        run: docker compose down --volumes
