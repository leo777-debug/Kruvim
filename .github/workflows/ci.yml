name: CI

on:
  push:
    branches: [main, kruvim]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check app tests scripts migrations tools
      - run: pytest -q

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kruvim
          POSTGRES_PASSWORD: kruvim
          POSTGRES_DB: kruvim
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kruvim" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      KRUVIM_DATABASE_URL: postgresql+asyncpg://kruvim:kruvim@localhost:5432/kruvim
      KRUVIM_REDIS_URL: redis://localhost:6379/0
      KRUVIM_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Upgrade, downgrade and upgrade again on PostgreSQL
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - run: alembic check
      - run: python -m tools.verify_production

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npx vite build
      - run: npm audit --audit-level=high

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t kruvim-api ./backend
      - run: docker build -t kruvim-web ./frontend
