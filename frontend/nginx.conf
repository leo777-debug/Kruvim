upstream kruvim_api {
    server api:8000;
    keepalive 32;
}

# Upgrade only when the client asks for it; plain requests keep the upstream keep-alive connection.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 512m;          # video uploads; the API enforces the real per-plan limit
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /nginx-health { access_log off; return 200 "ok\n"; }

    # Server-sent events: no buffering, long reads, so live simulations stream round by round.
    location ~ ^/api/v1/simulations/[^/]+/events$ {
        proxy_pass http://kruvim_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding on;
    }

    location /api/ {
        proxy_pass http://kruvim_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    # Health and metrics stay internal to the cluster network.
    location ~ ^/(healthz|readyz|metrics)$ { return 404; }

    # Hashed build assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: every other route serves index.html (never cached, so deploys take effect immediately).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
